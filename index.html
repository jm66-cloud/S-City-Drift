  <div id="crt-monitor">
    <div class="crt-screen">
      <div id="top-bar" class="top-bar"></div>
      <div id="desktop" class="desktop">
        <div id="icon-grid" class="icon-grid"></div>
        <div id="window-container" class="window-container"></div>
        <div id="new-game-overlay" class="new-game-overlay">
          <div class="new-game-box">
            <h1>S市漂模拟 v1.0</h1>
            <div class="story-text" id="story-text">
              2000年，你大学刚毕业，<br>
              揣着打工攒下的10万块钱，<br>
              坐上了开往这座城的绿皮火车...<br>
              在这座城市里，你要面对<br>
              人情世故、商场暗战、甚至法律的边界<br>
              你的选择，将决定你的未来。
            </div>
            <div class="difficulty-select">
              <label>难度选择：</label>
              <button class="diff-btn active" data-diff="1" onclick="Game.setDifficulty(1)">普通</button>
              <button class="diff-btn" data-diff="0" onclick="Game.setDifficulty(0)">简单</button>
              <button class="diff-btn" data-diff="2" onclick="Game.setDifficulty(2)">困难</button>
            </div>
            <div class="name-input-row">
              <label>姓名：</label>
              <input type="text" id="player-name" placeholder="输入你的名字" maxlength="8">
            </div>
            <button class="start-btn" onclick="Game.startNew()">开始新生活</button>
          </div>
        </div>
        <div id="modal-overlay" class="modal-overlay hidden"></div>
      </div>
      <div id="status-bar" class="status-bar"></div>
    </div>
    <div class="crt-brand">S市漂模拟</div>
    <div class="crt-led"></div>
  </div>
